name: Repository checks

on:
  push:
  pull_request:

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild canonical evidence tables
        run: python src/step08_train_champion_v3.py --mode evidence

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -p "test_*.py"
